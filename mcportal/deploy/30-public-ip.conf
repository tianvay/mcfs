# Minecraft Family Portal - before every start: public IPv4 from the router into server-udp-ports
# (NetherNet game traffic for players outside the home network, see /opt/mcportal/bin/mc-public-ip).
# Rollback: delete this file, systemctl daemon-reload - the lines in server.properties then stay as they are.
[Service]
# the UDP ports forwarded in the router (IPv4 and IPv6), at most 16
Environment=MC_UDP_PORTS=19140-19149
ExecStartPre=/usr/bin/python3 -I /opt/mcportal/bin/mc-public-ip
