# Minecraft Family Portal (M2) - extends minecraft-bedrock.service, the original file stays untouched.
# Rollback: sudo bash deploy/m2-console.sh rollback
[Unit]
Requires=minecraft-bedrock.socket
After=minecraft-bedrock.socket

[Service]
# stdin from the console FIFO; output keeps going to the journal
Sockets=minecraft-bedrock.socket
StandardInput=socket
StandardOutput=journal
StandardError=journal
# Clean shutdown: the server's own "stop" command saves the world.
# systemd falls back to SIGTERM only if the server has not exited after 60 s.
ExecStop=/bin/sh -c 'echo stop > /run/minecraft-bedrock/console; while kill -0 $MAINPID 2>/dev/null; do sleep 1; done'
TimeoutStopSec=60
