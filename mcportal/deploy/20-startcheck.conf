# Minecraft Family Portal (M8) - a start only counts as successful when players can really join.
# Rollback: delete this file, systemctl daemon-reload.
[Unit]
# at most 4 automatic attempts within 15 minutes, then the unit stays failed (no endless loop)
StartLimitIntervalSec=900
StartLimitBurst=4

[Service]
ExecStartPre=/opt/mcportal/bin/mc-start-check pre
ExecStartPost=/opt/mcportal/bin/mc-start-check post $MAINPID
# pre (max 120 s) + post (max 150 s) + loading time
TimeoutStartSec=330
Restart=on-failure
RestartSec=15
